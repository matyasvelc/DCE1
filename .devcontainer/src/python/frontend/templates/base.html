<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Skladová evidence{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">📦 Skladová evidence</a>
    <nav>
        <a href="{{ url_for('index') }}">Položky</a>
        <a href="{{ url_for('index', status='REORDER') }}">K doobjednání</a>
        <a href="{{ url_for('movements') }}">Auditní log</a>
    </nav>
</header>
<main>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
