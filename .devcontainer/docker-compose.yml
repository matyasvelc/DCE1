# Inventory Tracker - local run
#   docker compose up --build        (from the .devcontainer directory)
# Parameters come from the .env file next to this file (see .env.example).

name: inventory-tracker

# Shared DB connection parameters for setup + backend
x-db-env: &db-env
  DB_HOST: postgresqldb
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  devel:
    build:
      context: .
      dockerfile: Dockerfile.devel
    volumes:
      - ../..:/workspaces
    ports:
      - "8088:5000"
    networks:
      - backend_network
      - frontend_network

  postgresqldb:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  setup:
    image: ${REGISTRY:-local}/inventory-setup:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.setup
    environment:
      <<: *db-env
      DB_SEED: ${DB_SEED:-true}
    depends_on:
      postgresqldb:
        condition: service_healthy
    restart: "no"
    networks:
      - backend_network

  backend:
    image: ${REGISTRY:-local}/inventory-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *db-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgresqldb:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "8091-8093:5000"
    networks:
      - backend_network
      - frontend_network

  frontend:
    image: ${REGISTRY:-local}/inventory-frontend:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:5000
      FRONTEND_SECRET_KEY: ${FRONTEND_SECRET_KEY:-dev-only-secret}
      DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Prague}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:5000"
    networks:
      - frontend_network

volumes:
  db-data:

networks:
  # frontend <-> backend
  frontend_network:
    driver: bridge
  # backend <-> database (frontend has no direct access to the DB)
  backend_network:
    driver: bridge
